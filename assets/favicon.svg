<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="node1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Left node -->
  <circle cx="28" cy="50" r="7" fill="none" stroke="url(#node1)" stroke-width="3.5"/>
  <!-- Right nodes -->
  <circle cx="72" cy="27" r="7" fill="none" stroke="rgba(255,255,255,0.95)" stroke-width="3.5"/>
  <circle cx="72" cy="50" r="7" fill="none" stroke="rgba(255,255,255,0.95)" stroke-width="3.5"/>
  <circle cx="72" cy="73" r="7" fill="none" stroke="rgba(255,255,255,0.95)" stroke-width="3.5"/>
  <!-- Connecting lines -->
  <line x1="35" y1="50" x2="65" y2="27" stroke="rgba(255,255,255,0.75)" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="35" y1="50" x2="65" y2="50" stroke="rgba(255,255,255,0.75)" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="35" y1="50" x2="65" y2="73" stroke="rgba(255,255,255,0.75)" stroke-width="2.8" stroke-linecap="round"/>
</svg>
